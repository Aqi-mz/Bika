<style>
/* Layout: app de campo — barra superior, conteúdo num só fluxo, separadores fixos em baixo. Alto contraste para uso ao sol. */
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --line:#D9DFD3; --fg:#18231A; --muted:#5B6A5E;
  --brand:#1F5C2E; --brand-ink:#FFFFFF; --maize:#E7A814; --maize-soft:#FFF3D1;
  --ok:#1E7B3A; --ok-soft:#E3F3E7; --warn:#A86200; --warn-soft:#FFF0D9; --bad:#B3261E; --bad-soft:#FBE4E2;
  --info-soft:#E6EEF8; --info:#1F4E8C;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101611; --surface:#18211A; --line:#2B382D; --fg:#E8EFE6; --muted:#9AAB9C;
  --brand:#3E9A57; --brand-ink:#0B130C; --maize:#F2B92B; --maize-soft:#3A2F12;
  --ok:#5CC27A; --ok-soft:#173222; --warn:#F0A945; --warn-soft:#3A2A12; --bad:#F2867D; --bad-soft:#3D1A17;
  --info-soft:#17263A; --info:#8DB6EA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101611; --surface:#18211A; --line:#2B382D; --fg:#E8EFE6; --muted:#9AAB9C;
  --brand:#3E9A57; --brand-ink:#0B130C; --maize:#F2B92B; --maize-soft:#3A2F12;
  --ok:#5CC27A; --ok-soft:#173222; --warn:#F0A945; --warn-soft:#3A2A12; --bad:#F2867D; --bad-soft:#3D1A17;
  --info-soft:#17263A; --info:#8DB6EA; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}

header.top .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.logo{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em}
.logo b{color:var(--maize)}
.who{margin-left:auto;font-size:13px;text-align:right;line-height:1.2;opacity:.95}
.who button{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.demo-band{background:var(--maize-soft);color:var(--fg);font-size:13px}
.demo-band .in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}

.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}

nav.tabs button{flex:1;border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:10px 4px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--brand)}
nav.tabs button[aria-current="page"]::before{content:"";display:block;width:28px;height:3px;border-radius:2px;background:var(--maize);margin-bottom:2px}
nav.tabs button:not([aria-current="page"])::before{content:"";display:block;height:3px;margin-bottom:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.goal{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.bar{grid-column:1/-1;height:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.done{background:var(--ok)}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.num{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.loc{background:var(--bg);border:1.5px dashed var(--line);border-radius:8px;padding:12px}
.loc.got{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.live{border:2px solid var(--maize);background:var(--maize-soft)}
.timer{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--bg);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.mono{white-space:nowrap}
tr:last-child td{border-bottom:0}
.visit{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.visit:last-child{border-bottom:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:9;max-width:calc(100% - 32px)}
.pct{font-weight:700;font-variant-numeric:tabular-nums}
a{color:var(--info)}
.photo-prev{max-width:160px;border-radius:8px;border:1px solid var(--line)}
.err{color:var(--bad);font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="demo-band" id="demoBand" hidden><div class="in">Modo demonstração: dados de exemplo guardados só neste dispositivo. PIN técnico <b>1234</b> · PIN supervisor <b>0000</b>.</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ================== CONFIGURAÇÃO ==================
   API_URL: URL do Web App do Google Apps Script (ver LEIA-ME).
   Vazio = modo demonstração (tudo local). */
var API_URL = (window.ROTAS_API_URL || "").trim();
var DEMO = !API_URL;

/* ================== UTILITÁRIOS ================== */
var $ = function(s, r){ return (r||document).querySelector(s); };
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
var mem = {};
function load(k, d){ try{ var v = localStorage.getItem("rt."+k); return v ? JSON.parse(v) : (k in mem ? mem[k] : d); }catch(e){ return k in mem ? mem[k] : d; } }
function save(k, v){ mem[k]=v; try{ localStorage.setItem("rt."+k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function pad(n){ return (n<10?"0":"")+n; }
function fDate(ts){ var d=new Date(ts); return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear(); }
function fTime(ts){ var d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function fDur(min){ if(min==null) return "—"; min=Math.round(min); return min<60 ? min+" min" : Math.floor(min/60)+" h "+pad(min%60); }
function isoDay(ts){ var d=new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function weekStart(ts){ var d=new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); }
function durMin(v){ return v.saida ? (new Date(v.saida.ts)-new Date(v.entrada.ts))/60000 : null; }
function dist(a,b){ var R=6371000,t=Math.PI/180,dLa=(b.lat-a.lat)*t,dLo=(b.lng-a.lng)*t;
  var x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.sqrt(x)); }
function mapsUrl(p){ return "https://www.google.com/maps?q="+p.lat+","+p.lng; }
function normPhone(s){ return String(s||"").replace(/\D/g,""); }
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true;},2600); }

/* ================== DADOS ================== */
var ZONAS = {"Nampula":[-15.1165,39.2666],"Pemba":[-12.974,40.5178],"Lichinga":[-13.3128,35.2406],"Montepuez":[-13.1256,38.9997],
  "Chiúre":[-13.4318,39.3352],"Mocuba":[-16.8392,36.9856],"Nicoadala":[-17.6077,36.8197],"Quelimane":[-17.8786,36.8883],
  "Chimoio":[-19.1164,33.4833],"Beira":[-19.8436,34.8389],"Catandica":[-18.0581,33.1777],"Maxixe":[-23.8597,35.3473],
  "Macia":[-25.0269,33.0981],"Chókwè":[-24.5337,32.9837],"Gurué":[-15.4626,36.9805],"Machava":[-25.9150,32.5170]};
var DEF_OBJ = {visitas:20, novos:5, sacos:100, recompras:6};

function session(){ return load("session", null); }
function myVisits(){ return load("visitas", []); }
function setMyVisits(v){ if(!save("visitas", v)) toast("Memória do telemóvel cheia — sincronize para libertar espaço."); }

function seedDemo(){
  if(load("seeded2", false)) return;
  var techs=[{nome:"Técnico Nampula (exemplo)",zona:"Nampula"},{nome:"Técnico Pemba (exemplo)",zona:"Pemba"},
             {nome:"Técnico Beira (exemplo)",zona:"Beira"},{nome:"Técnico Chimoio (exemplo)",zona:"Chimoio"}];
  var nomes=["Aviário Muhala","Agro Namicopo","Granja Napipine","Loja do Sr. Amade","Aviário Esperança","Agrodealer Matola","Granja Boa Vida","Aviário Lurdes","Casa Agrícola Rovuma","Aviário Josina","Aviário Sete Irmãos","Granja Mãe Rosa"];
  var all=[], carteira=[], ws=weekStart(Date.now()), now=Date.now(), seed=7;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  techs.forEach(function(t,ti){
    var z=ZONAS[t.zona];
    // carteira do técnico: 8 clientes já existentes (importados) + 4 que vai angariar
    var cl=nomes.map(function(n,i){ return {nome:n, contacto:"+258 8"+(4+ti)+" "+(100+Math.floor(rnd()*899))+" "+(1000+Math.floor(rnd()*8999)),
      lat:+(z[0]+(rnd()-.5)*.12).toFixed(6), lng:+(z[1]+(rnd()-.5)*.12).toFixed(6), novo:i>=8}; });
    cl.forEach(function(c){ if(!c.novo) carteira.push({id:uid(),nome:c.nome,contacto:c.contacto,localidade:t.zona,tecnico:t.nome,lat:c.lat,lng:c.lng,exemplo:true}); });
    var nDays=Math.max(1,Math.min(5,Math.floor((now-ws)/864e5)+1)), seen={};
    for(var d=0; d<nDays; d++){
      var perDay=2+Math.floor(rnd()*3), h=8;
      for(var k=0;k<perDay;k++){
        var start=ws+d*864e5+(h*60+Math.floor(rnd()*50))*60000; if(start>now-3600000) break;
        var dur=12+Math.floor(rnd()*55); if(ti===2&&k===0) dur=3;
        var c=cl[Math.floor(rnd()*cl.length)], lat=c.lat+(rnd()-.5)*.0006, lng=c.lng+(rnd()-.5)*.0006;
        var acc=8+Math.floor(rnd()*30); if(ti===3&&d===0&&k===1) acc=240;
        var novo=c.novo&&!seen[c.nome]; seen[c.nome]=1;
        var sacos=rnd()<.6?Math.floor(rnd()*12)*2:0;
        all.push({id:uid()+ti+d+k, tecnico:t.nome, cliente:c.nome, contacto:c.contacto,
          localidade:t.zona, tipo:novo?"novo":"existente", entrada:{ts:new Date(start).toISOString(),lat:+lat.toFixed(6),lng:+lng.toFixed(6),acc:acc},
          saida:{ts:new Date(start+dur*60000).toISOString(),lat:+(lat+.0002).toFixed(6),lng:+(lng+.0001).toFixed(6),acc:acc+3},
          sacos:sacos, comprou:sacos>0, notas:novo?"Cliente angariado nesta visita":"", foto:"", exemplo:true, sync:1});
        h+=1+Math.floor(rnd()*2);
      }
    }
  });
  // um par "mesmo local" para mostrar o alerta
  var a=all.filter(function(v){return v.tecnico===techs[1].nome;});
  if(a.length>1&&a[0].cliente!==a[1].cliente&&isoDay(a[0].entrada.ts)===isoDay(a[1].entrada.ts)){ a[1].entrada.lat=a[0].entrada.lat+.00008; a[1].entrada.lng=a[0].entrada.lng; }
  save("demoAll", all);
  save("tecnicos", techs);
  save("carteira", carteira);
  var obj={}; techs.forEach(function(t){ obj[t.nome]=Object.assign({},DEF_OBJ); }); save("objetivos", obj);
  save("confirmacoes", []);
  save("seeded2", true);
}

/* Lista unificada de clientes: carteira importada + clientes que só existem nas visitas */
function clienteKey(nome,contacto){ return normPhone(contacto).slice(-9) || String(nome||"").trim().toLowerCase(); }
function clientesUnificados(carteira, visitas){
  var map={}, out=[];
  (carteira||[]).forEach(function(c){ var k=clienteKey(c.nome,c.contacto); if(map[k]) return;
    var o={nome:c.nome,contacto:c.contacto,localidade:c.localidade||"",tecnico:c.tecnico||"",lat:c.lat,lng:c.lng,origem:"importado",visitas:0,sacos:0,primeira:null,ultima:null,notas:""}; map[k]=o; out.push(o); });
  (visitas||[]).slice().sort(function(a,b){return a.entrada.ts<b.entrada.ts?-1:1;}).forEach(function(v){
    var k=clienteKey(v.cliente,v.contacto), o=map[k];
    if(!o){ o={nome:v.cliente,contacto:v.contacto,localidade:v.localidade||"",tecnico:v.tecnico,lat:v.entrada.lat,lng:v.entrada.lng,origem:v.tipo==="novo"?"novo":"fora",visitas:0,sacos:0,primeira:null,ultima:null,notas:v.notas||""}; map[k]=o; out.push(o); }
    o.visitas++; o.sacos+=(+v.sacos||0); if(!o.primeira) o.primeira=v.entrada.ts; o.ultima=v.entrada.ts; if(!o.tecnico) o.tecnico=v.tecnico;
    if(o.lat==null||o.lat===""){ o.lat=v.entrada.lat; o.lng=v.entrada.lng; }
  });
  return out;
}
var ORIGEM={importado:["neutral","Carteira"],novo:["info","Novo (app)"],fora:["warn","Fora da carteira"]};

/* Ficheiros: usa o pedido de download da plataforma quando existe; senão download normal; senão copiar. */
function saveFile(filename, text, fallbackEl){
  var bom="﻿"+text;
  function copyFallback(){ if(fallbackEl){ fallbackEl.value=text; fallbackEl.hidden=false; fallbackEl.select(); }
    if(navigator.clipboard) navigator.clipboard.writeText(text).then(function(){toast("Copiado: cole no Excel");},function(){});
    else toast("Selecione o texto e copie para o Excel"); }
  var p = window.claude && window.claude.use ? window.claude.use("downloads") : Promise.resolve(null);
  p.then(function(dl){
    if(dl) return dl.save({filename:filename,data:bom}).then(function(){toast("Ficheiro guardado");},function(e){ if(e&&e.code!=="declined") copyFallback(); });
    try{ var a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([bom],{type:"text/csv;charset=utf-8"})); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); toast("Ficheiro descarregado"); }
    catch(e){ copyFallback(); }
  },copyFallback);
}
function toCSV(rows){ return rows.map(function(r){ return r.map(function(c){ c=c==null?"":String(c); return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(";"); }).join("\n"); }

/* Importação de Excel/CSV: deteta as colunas pelo nome do cabeçalho */
var COLS={nome:/^(nome|cliente|nome do cliente|nome cliente|avi[aá]rio|agrodealer|raz[aã]o social|empresa)/i,
  contacto:/(contact|telef|telem[oó]v|celular|phone|^tel)/i, localidade:/(localidade|local|distrito|zona|cidade|prov[ií]ncia|bairro|posto)/i,
  tecnico:/(t[eé]cnico|respons|comercial|vendedor)/i, lat:/^lat/i, lng:/^(lng|lon|long)/i};
function parseRows(rows){
  var hi=-1, map={};
  for(var r=0;r<Math.min(10,rows.length);r++){ var m={}, n=0;
    (rows[r]||[]).forEach(function(h,i){ h=String(h||"").trim(); Object.keys(COLS).forEach(function(k){ if(m[k]==null&&h&&COLS[k].test(h)){ m[k]=i; n++; } }); });
    if(m.nome!=null&&n>=2){ hi=r; map=m; break; } }
  if(hi<0) return {erro:"Não encontrei o cabeçalho. A 1.ª linha deve ter pelo menos as colunas “Nome” e “Contacto”."};
  var out=[];
  rows.slice(hi+1).forEach(function(r){ var g=function(k){ return map[k]==null?"":String(r[map[k]]==null?"":r[map[k]]).trim(); };
    if(!g("nome")) return; var lat=parseFloat(String(g("lat")).replace(",",".")), lng=parseFloat(String(g("lng")).replace(",","."));
    out.push({id:uid(),nome:g("nome"),contacto:g("contacto"),localidade:g("localidade"),tecnico:g("tecnico"),lat:isFinite(lat)?lat:"",lng:isFinite(lng)?lng:""}); });

function readSheetFile(file, cb){

  r.onload=function(){
    try{
      if(window.XLSX){ var wb=XLSX.read(new Uint8Array(r.result),{type:"array"}); var sh=wb.Sheets[wb.SheetNames[0]];
        return cb(parseRows(XLSX.utils.sheet_to_json(sh,{header:1,raw:false,defval:""}))); }
      var txt=new TextDecoder("utf-8").decode(r.result), sep=(txt.split("\n")[0].match(/;/g)||[]).length>=(txt.split("\n")[0].match(/,/g)||[]).length?";":",";
      cb(parseRows(txt.split(/\r?\n/).map(function(l){ return l.split(sep).map(function(c){return c.replace(/^"|"$/g,"");}); })));

/* ================== ALERTAS ================== */
function computeAlerts(list, confirm, carteira){
  var byTechDay={}, firstLoc={}, cmap={}, cart={};
  (confirm||[]).forEach(function(c){ cmap[c.visitaId]=c; });
  (carteira||[]).forEach(function(c){ var la=parseFloat(c.lat), lo=parseFloat(c.lng); if(isFinite(la)&&isFinite(lo)) cart[clienteKey(c.nome,c.contacto)]={lat:la,lng:lo}; });
  var sorted=list.slice().sort(function(a,b){ return a.entrada.ts<b.entrada.ts?-1:1; });
  sorted.forEach(function(v){
    var al=[], d=durMin(v);
    if(!v.saida){ if(Date.now()-new Date(v.entrada.ts)>12*3600000) al.push(["bad","Sem saída"]); }
    else if(d<5) al.push(["warn","Visita < 5 min"]);
    if(v.entrada.acc>100) al.push(["warn","GPS impreciso ("+Math.round(v.entrada.acc)+" m)"]);
    if(v.entrada.simulado) al.push(["neutral","GPS simulado"]);
    var key=v.tecnico+"|"+isoDay(v.entrada.ts);
    (byTechDay[key]=byTechDay[key]||[]).forEach(function(o){
      if(o.cliente.toLowerCase()!==v.cliente.toLowerCase() && dist(o.entrada,v.entrada)<30) al.push(["bad","Mesmo local que "+o.cliente]);
    });
    byTechDay[key].push(v);
    var ck=clienteKey(v.cliente,v.contacto);
    if(cart[ck]){ var dc=dist(cart[ck],v.entrada); if(dc>300) al.push(["bad","Longe do local do cliente ("+(dc/1000).toFixed(1)+" km)"]); }
    else if(firstLoc[ck]){ var dd=dist(firstLoc[ck],v.entrada); if(dd>500) al.push(["warn","Longe da 1.ª visita ("+(dd/1000).toFixed(1)+" km)"]); }
    if(!firstLoc[ck]) firstLoc[ck]=v.entrada;
    var c=cmap[v.id];
    if(c){ al.push(c.resultado==="confirmou"?["ok","Confirmada por chamada"]:c.resultado==="nao_confirmou"?["bad","Cliente NÃO confirmou"]:["neutral","Chamada sem resposta"]); }
    v._alerts=al;
  });
  return sorted;
}

function weekStats(list, tecnico, ws){
  var we=ws+7*864e5, s={visitas:0,novos:0,sacos:0,recompras:0};
  list.forEach(function(v){
    if(v.tecnico!==tecnico) return; var t=new Date(v.entrada.ts).getTime(); if(t<ws||t>=we) return;
    s.visitas++; if(v.tipo==="novo") s.novos++; s.sacos+=(+v.sacos||0); if(v.tipo==="existente"&&v.comprou) s.recompras++;
  });
  return s;
}
function pctOf(s,o){ var keys=["visitas","novos","sacos","recompras"], t=0, n=0;
  keys.forEach(function(k){ if(o[k]>0){ t+=Math.min(1,s[k]/o[k]); n++; } }); return n?Math.round(100*t/n):0; }

    cb(null,{ts:new Date().toISOString(),lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)});

  },{enableHighAccuracy:true,timeout:60000,maximumAge:0});
}

/* Sincronização: envia o que falta; sem rede, fica guardado. */
var syncing=false;
function trySync(manual, force){
  if(DEMO||syncing) return; var s=session(); if(!s||s.role!=="tec") return;
  var pend=myVisits().filter(function(v){return !v.sync;}); if(!pend.length && !manual && !force) return;
  if(!navigator.onLine){ if(manual) toast("Sem rede. Os registos ficam guardados no telemóvel."); return; }
  syncing=true;
  api({action:"sync",tecnico:s.tecnico,pin:s.pin,visitas:pend}).then(function(j){
    var ids={}; (j.ids||[]).forEach(function(i){ids[i]=1;});
    var all=myVisits().map(function(v){ if(ids[v.id]){ v.sync=1; if(j.fotos&&j.fotos[v.id]) v.foto=j.fotos[v.id]; else if(v.foto&&v.foto.indexOf("data:")===0) v.foto="(enviada)"; } return v; });
    var cut=Date.now()-60*864e5; all=all.filter(function(v){ return !v.sync || new Date(v.entrada.ts).getTime()>cut; });
    setMyVisits(all);
    if(j.objetivos){ var o=load("objetivos",{}); o[s.tecnico]=j.objetivos; save("objetivos",o); }
    if(j.clientes) save("clientes",j.clientes);
    if(manual) toast("Sincronizado: "+(j.ids||[]).length+" registo(s)."); syncing=false; if(ui.tab==="hoje") render();
  }).catch(function(x){ syncing=false; if(manual) toast("Não foi possível enviar: "+(x.message||"sem rede")); });
}
window.addEventListener("online",function(){ trySync(); });
setInterval(function(){ trySync(); },5*60000);

     return '<tr><td><strong>'+esc(c.nome)+'</strong></td><td class="mono">'+esc(c.contacto)+'</td><td>'+esc(c.localidade)+'</td><td>'+esc(c.tecnico)+'</td>'+

       '<td style="white-space:nowrap">'+(c.ultima?fDate(c.ultima)+' <span class="small '+(days>30?'err':'muted')+'">('+days+' d)</span>':'<span class="pill bad">Nunca visitado</span>')+'</td>'+
       '<td class="n">'+c.visitas+'</td><td class="n">'+c.sacos+'</td>'+
       '<td>'+(c.lat!==""&&c.lat!=null&&isFinite(c.lat)?'<a href="'+mapsUrl(c)+'" target="_blank" rel="noopener">mapa</a>':'<span class="muted small">sem GPS</span>')+'</td></tr>'; }).join("")
    ||'<tr><td colspan="9" class="muted">Sem clientes. Carregue a listagem em Excel ou aguarde as primeiras visitas.</td></tr>')+
   '</tbody></table></div>'+(list.length>500?'<p class="small muted">A mostrar 500 de '+list.length+'. Use os filtros ou exporte.</p>':'')+
   '<textarea id="cOut" rows="4" hidden aria-label="CSV para copiar"></textarea></div>';
  bindRefresh();
  $("#cO").onchange=function(){cli.origem=this.value;render();}; $("#cT").onchange=function(){cli.tec=this.value;render();};
  $("#cS").onchange=function(){cli.sem=this.value;render();};
  $("#cQ").onchange=function(){cli.q=this.value.trim();render();};
  $("#nD").onchange=function(){cli.de=this.value;render();}; $("#nA").onchange=function(){cli.ate=this.value;render();};
  $("#cf").onchange=function(){ var f=this.files[0]; if(!f) return; readSheetFile(f,function(res){ cli.erro=res.erro||""; cli.preview=res.erro?null:res; if(res.clientes&&!res.clientes.length){ cli.erro="O ficheiro não tem clientes com nome."; cli.preview=null; } render(); }); };
  $("#tpl").onclick=function(){ saveFile("modelo_clientes.csv", toCSV([["Nome","Contacto","Localidade","Técnico","Latitude","Longitude"],["Aviário Exemplo","+258 84 123 4567","Nampula","","-15.1165","39.2666"]]), $("#cOut")); };
  if(pv){
    $("#mJ").onclick=function(){cli.modo="juntar";render();}; $("#mS").onclick=function(){cli.modo="substituir";render();};
    $("#cx").onclick=function(){cli.preview=null;render();};
    $("#imp").onclick=function(){ var b=this; b.disabled=true;
      if(DEMO){ var cur=cli.modo==="substituir"?[]:load("carteira",[]), idx={};
        cur.forEach(function(c,i){ idx[clienteKey(c.nome,c.contacto)]=i; });
        pv.clientes.forEach(function(c){ var k=clienteKey(c.nome,c.contacto); if(idx[k]!=null) cur[idx[k]]=Object.assign(cur[idx[k]],c); else { idx[k]=cur.length; cur.push(c); } });
        save("carteira",cur); toast(pv.clientes.length+" clientes importados"); cli.preview=null; return render(); }
      api({action:"clientes",pin:session().pin,modo:cli.modo,clientes:pv.clientes}).then(function(j){ cli.preview=null; toast((j.total||pv.clientes.length)+" clientes na carteira"); refreshSup(render); })
        .catch(function(x){ b.disabled=false; toast("Não importou: "+x.message); }); };
  }
  $("#expN").onclick=function(){
    var vis=d.visitas;
    saveFile("novos_clientes_"+cli.de+"_"+cli.ate+".csv", toCSV([["Data angariação","Técnico","Cliente","Contacto","Localidade","Latitude","Longitude","Mapa","Nº visitas","Sacos (total)","Notas 1.ª visita"]].concat(
      novos.map(function(c){ return [fDate(c.primeira),c.tecnico,c.nome,c.contacto,c.localidade,c.lat,c.lng,mapsUrl(c),c.visitas,c.sacos,c.notas]; }))), $("#cOut")); };
  $("#expL").onclick=function(){
    saveFile("clientes.csv", toCSV([["Cliente","Contacto","Localidade","Técnico","Origem","1.ª visita","Última visita","Visitas","Sacos","Latitude","Longitude"]].concat(
      list.map(function(c){ return [c.nome,c.contacto,c.localidade,c.tecnico,ORIGEM[c.origem][1],c.primeira?fDate(c.primeira):"",c.ultima?fDate(c.ultima):"",c.visitas,c.sacos,c.lat,c.lng]; }))), $("#cOut")); };
}

function viewObj(){
  var d=supData();
  $("#view").innerHTML='<form id="of" class="stack">'+supHeader("Objetivos semanais","Por técnico")+
   '<div class="tablewrap"><table><thead><tr><th>Técnico</th><th class="n">Visitas</th><th class="n">Novos clientes</th><th class="n">Sacos ração</th><th class="n">Recompras</th></tr></thead><tbody>'+
   (d.tecnicos.map(function(t,i){ var o=d.objetivos[t.nome]||DEF_OBJ;
     return '<tr><td><strong>'+esc(t.nome)+'</strong><div class="small muted">'+esc(t.zona||"")+'</div></td>'+["visitas","novos","sacos","recompras"].map(function(k){
       return '<td class="n"><input aria-label="'+k+' '+esc(t.nome)+'" id="o_'+i+'_'+k+'" data-t="'+esc(t.nome)+'" data-k="'+k+'" type="number" min="0" value="'+(o[k]||0)+'" style="width:90px;text-align:right"></td>'; }).join("")+'</tr>'; }).join("")
    ||'<tr><td colspan="5" class="muted">Sem técnicos. Adicione-os na folha “Tecnicos” do Google Sheet.</td></tr>')+
   '</tbody></table></div><button class="btn primary" type="submit">Guardar objetivos</button>'+
   '<p class="small muted">Os técnicos recebem os novos objetivos na próxima sincronização.</p></form>';
  bindRefresh();
  $("#of").onsubmit=function(e){ e.preventDefault(); var o={};
    [].forEach.call(document.querySelectorAll("#of input[data-t]"),function(i){ (o[i.dataset.t]=o[i.dataset.t]||{})[i.dataset.k]=Math.max(0,parseInt(i.value,10)||0); });
    if(DEMO){ save("objetivos",o); toast("Objetivos guardados"); return render(); }
    api({action:"objetivos",pin:session().pin,objetivos:o}).then(function(){ var sd=load("supData",{}); sd.objetivos=o; save("supData",sd); toast("Objetivos guardados"); render(); })
      .catch(function(x){ toast("Não gravou: "+x.message); }); };
}

/* ================== ROUTER ================== */
function render(){
  setWho(); var s=session();
  if(!s) return viewLogin();
  if(s.role==="sup"){
    if(["painel","visitas","cli","conf","obj"].indexOf(ui.tab)<0) ui.tab="painel";
    setTabs([["painel","Painel","painel"],["visitas","Visitas","visitas"],["cli","Clientes","cli"],["conf","Confirmar","conf"],["obj","Objetivos","obj"]]);
    return {painel:viewPainel,visitas:viewVisitas,cli:viewClientes,conf:viewConf,obj:viewObj}[ui.tab]();
  }
  if(["hoje","nova","hist"].indexOf(ui.tab)<0) ui.tab="hoje";
  setTabs([["hoje","Hoje","hoje"],["nova","Nova visita","nova"],["hist","Histórico","hist"]]);
  ({hoje:viewHoje,nova:viewNova,hist:viewHist})[ui.tab]();
}

if(DEMO){ seedDemo(); $("#demoBand").hidden=false; }
render();
if(!DEMO){ setTimeout(function(){ trySync(false,true); },1500); }
if(window.ROTAS_HOSTED && "serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
</script>
